  <script>
    (function () {
      "use strict";
      var tl = gsap.timeline({ paused: true });
      var chips = [0, 1, 2, 3, 4].map(function (i) {
        return document.getElementById("three-chip-" + i);
      });
      var lines = [0, 1, 2].map(function (i) {
        return document.getElementById("three-line-" + i);
      });

      // The header establishes immediately; the chips arrive as the VO reads them.
      tl.fromTo(
        "#three-screen",
        { y: 26, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.05
      );

      // dynamic-content-sequencing: beat window per chip scales with its label length.
      var CHIPS = [
        { label: "2026-11-20", hold: 1.0 },
        { label: "500", hold: 0.8 },
        { label: "$30,000 max", hold: 1.1 },
        { label: "02:00", hold: 0.9 },
        { label: "AV required", hold: 0.7 },
      ];
      var BASE = 0.5;
      var SEC_PER_CHAR = 0.045;
      var AT = [1.05, 2.0, 2.75, 3.75, 4.7]; // window = BASE + chars*SEC_PER_CHAR + hold, clamped to 8s
      for (var c = 0; c < CHIPS.length; c++) {
        CHIPS[c].window = BASE + CHIPS[c].label.length * SEC_PER_CHAR + CHIPS[c].hold;
        AT[c] = Math.min(AT[c], 7.4 - CHIPS[c].window + BASE);
      }

      chips.forEach(function (chip, i) {
        tl.fromTo(
          chip,
          { y: 18, opacity: 0, scale: 0.92 },
          { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" },
          AT[i]
        );
        for (var j = 0; j < i; j++) {
          tl.to(chips[j], { opacity: 0.62, duration: 0.35, ease: "power2.out" }, AT[i]);
        }
      });

      // activity rail + live agent lines arrive behind the header beat
      tl.fromTo(
        "#three-rail",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        1.6
      );
      // venue cards settle under the chips, one per second half beat
      tl.fromTo(
        "#three-venue-0",
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        5.35
      );
      tl.fromTo(
        "#three-venue-1",
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        6.15
      );
      tl.fromTo(
        "#three-setspecs",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" },
        6.9
      );
      var LINE_AT = [2.3, 3.4, 4.6];
      lines.forEach(function (line, i) {
        tl.fromTo(
          line,
          { x: 22, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          LINE_AT[i]
        );
      });

      window.__timelines["03-demo-constraints"] = tl;

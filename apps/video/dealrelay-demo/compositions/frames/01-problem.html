  <div id="root" data-composition-id="01-problem" data-width="1920" data-height="1080">

    <div id="one-grid" class="clip bg-clip" data-start="0" data-duration="8" data-track-index="1"></div>

    <div id="one-stage">
      <div class="one-beat" data-tone="in">
        <div class="one-stamp">MON 09:12</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    (function () {
      "use strict";
      var tl = gsap.timeline({ paused: true });
      var D = 8;
      var stage = document.getElementById("one-stage");
      var glow = document.getElementById("one-glow");
      var beats = gsap.utils.toArray(".one-beat");
      var stamps = beats.map(function (b) { return b.querySelector(".one-stamp"); });
      var msgs = beats.map(function (b) { return b.querySelector(".one-msg"); });

      // Reveal schedule (content-state swaps on thresholds, per discrete-text-sequence)
      var STAMPS_AT = [0.2, 1.6, 3.0, 4.4, 6.2];
      var MSGS_AT = [0.3, 1.7, 3.1, 4.5, 6.3];

      beats.forEach(function (beat, i) {
        var s = stamps[i];
        var m = msgs[i];
        var drift = [-14, -30, -22, -44, -58][i];

        // timestamp: stamps in dim, drifts apart as the chain grows
        tl.fromTo(
          s,
          { opacity: 0, x: 26 },
          { opacity: 0.95, x: 0, duration: 0.5, ease: "power3.out" },
          STAMPS_AT[i]
        );
        tl.to(s, { x: drift, duration: 3.4, ease: "sine.inOut" }, STAMPS_AT[i] + 0.5);
        // message: staggered rise + fade on its beat
        tl.fromTo(
          m,
          { y: 40, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
          MSGS_AT[i]
        );
        // older lines settle back as new ones land
        for (var j = 0; j < i; j++) {
          tl.to(
            msgs[j],
            { opacity: 0.26, duration: 0.6, ease: "power2.out" },
            MSGS_AT[i]
          );
          tl.to(
            stamps[j],
            { opacity: 0.16, duration: 0.6, ease: "power2.out" },
            MSGS_AT[i]
          );
        }
      });

      // slow push-in under the whole run (camera modifier)
      tl.fromTo(stage, { scale: 1 }, { scale: 1.045, duration: D, ease: "sine.inOut" }, 0);

      // closing pale band sweep -> wipes the frame away
      tl.fromTo(
        glow,
        { x: -2100, opacity: 0 },
        { x: 2100, opacity: 1, duration: 0.85, ease: "power2.inOut" },
        6.6
      );

      // epilogue rail line lands in the glow's wake
      tl.fromTo(
        "#one-line",
        { x: 30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        6.7
      );

      window.__timelines["01-problem"] = tl;
    })();
  </script>

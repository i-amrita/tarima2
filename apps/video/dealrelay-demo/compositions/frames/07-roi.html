        background: radial-gradient(

      .roi-sublabel {

      }
    </style>

        <!-- Beat 1: 4 days (struck) vs 46 seconds -->
        <div class="roi-beat" id="roi-beat-1">

        <!-- Beat 2: 3 agents -->
        <div class="roi-beat" id="roi-beat-2">
          <div class="roi-glow" id="roi-glow-2"></div>
          <div class="roi-row roi-eyebrow" style="top: 13cqh" id="roi-b2-eyebrow">

          </div>
          <div class="roi-row" style="top: 22cqh">
            <div class="roi-fig">
              <div class="roi-figrow">

              </span>
              <span class="roi-pill" id="roi-pill-2">
                <span class="roi-dot" style="background: #7a3fb8"></span>Finance
              </span>
              <span class="roi-pill" id="roi-pill-3">
                <span class="roi-dot" style="background: #956400"></span>Negotiator
              </span>
            </div>
          </div>
        </div>

        <!-- Beat 3: 1 approval, 0 lost threads -->
        <div class="roi-beat" id="roi-beat-3">
          <div class="roi-glow" id="roi-glow-3"></div>
          <div class="roi-row roi-eyebrow" style="top: 12cqh" id="roi-b3-eyebrow">
            Control
          </div>
          <div class="roi-row" style="top: 20cqh">
            <div class="roi-fig">
              <div class="roi-figrow">
                <span class="roi-num" id="roi-b3-num" style="font-size: 24cqh">0</span>

              </div>

              <span class="roi-subnum" id="roi-b3-subnum">0</span>
              <span class="roi-sublabel">lost threads</span>
            </div>
          </div>

        </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";

        var root = document.getElementById("root");
        var camera = document.getElementById("roi-camera");
        var band = document.getElementById("roi-band");
        var orbA = document.getElementById("roi-orb-a");
        var orbB = document.getElementById("roi-orb-b");

        var tl = gsap.timeline({ paused: true });

        // ---- ground -------------------------------------------------------
        orbA.style.width = "46cqw";
        orbA.style.height = "46cqw";
        orbA.style.left = "-10cqw";
        orbA.style.top = "4cqh";
        orbA.style.background = "rgba(31, 108, 159, 0.30)";
        orbB.style.width = "40cqw";
        orbB.style.height = "40cqw";
        orbB.style.left = "64cqw";
        orbB.style.top = "46cqh";
        orbB.style.background = "rgba(122, 63, 184, 0.26)";

        tl.fromTo(
          band,
          { x: "-140%" },
          { x: "540%", duration: 1.15, ease: "power2.inOut" },
          0,
        );
        tl.fromTo(
          orbA,
          { y: 0 },
          { y: 34, duration: 8, ease: "sine.inOut" },
          0,
        );
        tl.fromTo(
          orbB,
          { y: 0 },
          { y: -30, duration: 8, ease: "sine.inOut" },
          0,
        );

        // ---- camera (slow continuous push) --------------------------------
        tl.fromTo(
          camera,
          { scale: 1 },
          { scale: 1.06, duration: 8, ease: "none" },
          0,
        );

        // ---- helpers ------------------------------------------------------
        function countUp(el, from, to, dur, start, ease, startScale) {
          var state = { v: from };
          var usedEase = ease || "power3.out";
          tl.to(
            state,
            {
              v: to,
              duration: dur,
              ease: usedEase,
              onUpdate: function () {
                el.textContent = Math.round(state.v).toLocaleString("en-US");
              },
            },
            start,
          );
          tl.fromTo(
            el,
            { scale: startScale },
            { scale: 1, duration: dur, ease: usedEase },
            start,
          );
          // restrained landing pulse
          tl.to(el, { scale: 1.045, duration: 0.14, ease: "power3.out" }, start + dur);
          tl.to(el, { scale: 1, duration: 0.24, ease: "power2.out" }, start + dur + 0.14);
        }

        function rise(el, start, dur, offset) {
          tl.fromTo(
            el,
            { opacity: 0, y: offset == null ? 14 : offset },
            { opacity: 1, y: 0, duration: dur, ease: "power2.out" },
            start,
          );
        }

        function beatIn(el, start) {
          tl.fromTo(
            el,
            { opacity: 0, scale: 0.62 },
            { opacity: 1, scale: 1, duration: 0.58, ease: "power3.out" },
            start,
          );
        }

        function beatOut(el, start) {
          tl.to(el, { opacity: 0, scale: 1.42, duration: 0.55, ease: "power2.in" }, start);
        }

        function bloom(glowEl, start, peak, bloomDur, breatheDur) {
          tl.fromTo(
            glowEl,
            { opacity: 0, scale: 0.8 },
            { opacity: peak, scale: 1, duration: bloomDur, ease: "power2.out" },
            start,
          );
          var phase = { p: 0 };
          tl.to(
            phase,
            {
              p: Math.PI * 2,
              duration: breatheDur,
              ease: "none",
              onUpdate: function () {
                var s = Math.sin(phase.p);
                glowEl.style.opacity = String(peak + s * 0.025);
                glowEl.style.transform = "scale(" + (1 + s * 0.02) + ")";
              },
            },
            start + bloomDur,
          );
        }

        // ---- beat 1: 4 days -> 46 seconds ---------------------------------
        var beat1 = document.getElementById("roi-beat-1");
        var beat2 = document.getElementById("roi-beat-2");
        var beat3 = document.getElementById("roi-beat-3");

        var b1numA = document.getElementById("roi-b1-num-a");
        var b1sufA = document.getElementById("roi-b1-suf-a");
        var b1numB = document.getElementById("roi-b1-num-b");
        var b1sufB = document.getElementById("roi-b1-suf-b");
        var b2num = document.getElementById("roi-b2-num");
        var b2suf = document.getElementById("roi-b2-suf");
        var b3num = document.getElementById("roi-b3-num");
        var b3suf = document.getElementById("roi-b3-suf");

        gsap.set([b1sufA, b1sufB, b2suf, b3suf], { opacity: 0, y: 20 });
        gsap.set("#roi-b1-strike", { scaleX: 0 });

        rise(document.getElementById("roi-b1-before"), 0.05, 0.5);
        countUp(b1numA, 0, 4, 0.9, 0.15, "power3.out", 0.5);
        tl.to(b1sufA, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 1.05);
        tl.fromTo(
          "#roi-b1-strike",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.45, ease: "power2.inOut" },
          1.15,
        );
        tl.to(b1numA, { opacity: 0.32, duration: 0.4, ease: "power2.out" }, 1.55);
        tl.to(b1sufA, { opacity: 0.28, duration: 0.4, ease: "power2.out" }, 1.55);
        rise(document.getElementById("roi-b1-after"), 1.6, 0.5);
        countUp(b1numB, 0, 46, 1.2, 1.75, "power3.out", 0.45);
        tl.to(b1sufB, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 2.95);
        rise(document.getElementById("roi-b1-label"), 2.95, 0.6, 18);
        bloom(document.getElementById("roi-glow-1"), 1.75, 0.28, 0.9, 3.2);
        beatOut(beat1, 3.35);

        // ---- beat 2: 3 agents ---------------------------------------------
        beatIn(beat2, 3.45);
        rise(document.getElementById("roi-b2-eyebrow"), 3.6, 0.5);
        countUp(b2num, 0, 3, 0.9, 3.75, "power3.out", 0.5);
        tl.to(b2suf, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 4.65);
        tl.fromTo(
          "#roi-pill-1",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
          4.8,
        );
        tl.fromTo(
          "#roi-pill-2",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
          4.92,
        );
        tl.fromTo(
          "#roi-pill-3",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
          5.04,
        );
        bloom(document.getElementById("roi-glow-2"), 3.75, 0.26, 0.8, 2.4);
        beatOut(beat2, 5.3);

        // ---- beat 3: 1 approval, 0 lost threads ----------------------------
        beatIn(beat3, 5.4);
        rise(document.getElementById("roi-b3-eyebrow"), 5.55, 0.5);
        countUp(b3num, 0, 1, 0.85, 5.7, "power3.out", 0.5);
        tl.to(b3suf, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 6.55);
        rise(document.getElementById("roi-b3-sub"), 6.7, 0.55, 16);
        rise(document.getElementById("roi-b3-label"), 6.9, 0.6, 18);
        bloom(document.getElementById("roi-glow-3"), 5.7, 0.26, 0.8, 1.3);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["07-roi"] = tl;
      })();
    </script>
  </div>
</template>

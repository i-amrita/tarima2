<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });

  // Rail starts collapsed (only the header shows); runs pop in on the stream cadence.
  gsap.set("#d5-runScout, #d5-runFinance, #d5-runNegotiator", { opacity: 0, y: 14 });
  gsap.set("#d5-line2, #d5-line3, #d5-line4", { opacity: 0 });
  gsap.set("#d5-strategyA, #d5-strategyB", { opacity: 0 });

  tl.fromTo("#d5-railcount", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.0);

  // Working-state theater: each run pops, then its lines type on (discrete-text-sequence).
  tl.to("#d5-runScout", { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.5)" }, 0.9);
  tl.to("#d5-runFinance", { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.5)" }, 3.4);
  tl.to("#d5-line2", { opacity: 1, duration: 0.25 }, 3.9);
  tl.to("#d5-line3", { opacity: 1, duration: 0.25 }, 6.2);
  tl.to("#d5-runNegotiator", { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.5)" }, 9.2);
  tl.to("#d5-line4", { opacity: 1, duration: 0.25 }, 9.7);

  // Typewriter: each message types via a smooth char-slice proxy at measured cadence.
  function typeIn(textEl, caretEl, full, start, dur) {
    gsap.set(textEl, { textContent: "" });
    const len = { v: 0 };
    tl.to(len, {
      v: full.length,
      duration: dur,
      ease: "none",
      onUpdate: () => { textEl.textContent = full.substring(0, Math.floor(len.v)); },
    }, start);
    // Caret rides the typing, then hides when the line completes.
    if (caretEl) {
      tl.fromTo(caretEl, { opacity: 1 }, { opacity: 1, duration: dur, ease: "none" }, start);
      tl.to(caretEl, { opacity: 0, duration: 0.2 }, start + dur);
    }
  }
  typeIn(document.getElementById("d5-text1"), "#d5-caret1", "parsed Grand Loft proposal", 1.4, 1.6);
  typeIn(document.getElementById("d5-text2"), "#d5-caret2", "$26,000 within $30,000 cap", 4.1, 1.6);
  typeIn(document.getElementById("d5-text3"), "#d5-caret3", "curfew 00:00 violates 02:00 requirement", 6.4, 1.9);
  typeIn(document.getElementById("d5-text4"), "#d5-caret4", "drafting counter-offer", 9.9, 1.4);

  // Red violation chips pulse in sync with the Finance curfew flag landing (~6.5s).
  tl.to("#d5-aCurfew", { scale: 1.07, duration: 0.22, ease: "power2.out", yoyo: true, repeat: 1 }, 6.7);
  tl.to("#d5-aCurfew", { scale: 1.07, duration: 0.22, ease: "power2.out", yoyo: true, repeat: 1 }, 7.6);
  tl.to("#d5-bBudget", { scale: 1.07, duration: 0.22, ease: "power2.out", yoyo: true, repeat: 1 }, 4.3);

  // Negotiator payoff: counter strategies type onto both cards, then statuses
  // flip to "Counter proposed" amber (hands off to the approval beat).
  tl.to("#d5-strategyA", { opacity: 1, duration: 0.3 }, 11.6);
  typeIn(document.getElementById("d5-strategyText"), null, "Counter: extend curfew to 01:30", 11.8, 0.9);
  tl.to("#d5-strategyB", { opacity: 1, duration: 0.3 }, 12.2);
  typeIn(document.getElementById("d5-strategyTextB"), null, "Counter: $27,000 cleaning deposit split", 12.4, 0.9);

  const flipStatus = (el) => {
    el.textContent = "Counter proposed";
    el.classList.remove("d5-met");
    el.classList.add("d5-pending");
  };
  const driver = { t: 0 };
  let flippedA = false, flippedB = false;
  const EVENT_MARKS = [1.4, 4.1, 6.4, 9.9];
  const railCount = document.getElementById("d5-railcount");
  let eventCount = 0;
  tl.to(driver, {
    t: 14,
    duration: 14,
    ease: "none",
    onUpdate: () => {
      while (eventCount < EVENT_MARKS.length && driver.t >= EVENT_MARKS[eventCount]) {
        eventCount++;
        railCount.textContent = eventCount + " events";
      }
      if (!flippedA && driver.t >= 13.0) { flipStatus(document.getElementById("d5-statusA")); flippedA = true; }
      if (!flippedB && driver.t >= 13.3) { flipStatus(document.getElementById("d5-statusB")); flippedB = true; }
    },
  }, 0);

  window.__timelines = window.__timelines || {};
  window.__timelines["05-demo-agents"] = tl;
  tl.seek(0);
</script>
